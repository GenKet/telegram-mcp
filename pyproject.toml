[tool.poetry]
name = "telegram-mcp"
version = "0.1.0"
description = "MCP server for testing Telegram bots via Claude Code"
authors = ["Your Name <your@email.com>"]
readme = "README.md"
packages = [{include = "telegram_mcp", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
mcp = "^1.0.0"
telethon = "^1.34.0"
python-dotenv = "^1.0.0"
aiofiles = "^23.2.1"
openai = "^1.50.0"
cryptography = ">=50.0.1"  # GHSA-g6cj-pr64-35w5 (transitive via pyjwt)

[tool.poetry.scripts]
telegram-mcp = "telegram_mcp.server:main"
telegram-mcp-auth = "telegram_mcp.auth:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"